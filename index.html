<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>시니어 롱폼 인사이트 툴 v2.0 (Cached)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html { scroll-behavior: smooth; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .wrap { word-break: break-word; }
    /* V/S Ratio 강조 스타일 */
    .high-potential { background-color: #ecfccb; } /* 연한 라임색 */
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="max-w-7xl mx-auto p-4 sm:p-6">
    <header class="mb-6 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-indigo-900">시니어 롱폼 인사이트 툴 v2.0</h1>
        <p class="text-sm text-gray-600 mt-1">캐싱 기능 & 구독자 대비 조회수(V/S) 분석 탑재</p>
      </div>
      <button id="btnClearCache" class="text-xs bg-red-100 text-red-600 px-3 py-1 rounded hover:bg-red-200">캐시 초기화</button>
    </header>

    <section class="bg-white rounded-2xl shadow p-4 mb-6 border border-indigo-100">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="col-span-1 md:col-span-2">
          <label class="block text-xs font-bold text-gray-500 mb-1">YOUTUBE API KEY</label>
          <input id="apiKey" type="password" class="w-full rounded-lg border-gray-300 focus:ring-indigo-500 text-sm" placeholder="여기에 키 입력" />
        </div>
        <div class="col-span-1 md:col-span-2">
          <label class="block text-xs font-bold text-gray-500 mb-1">검색어 (타깃 키워드)</label>
          <input id="q" type="text" class="w-full rounded-lg border-gray-300 focus:ring-indigo-500 text-sm font-bold" placeholder="예: 60대 건강, 당뇨 식단" />
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">정렬 기준</label>
          <select id="order" class="w-full rounded-lg border-gray-300 text-sm">
            <option value="viewCount">조회수순 (검증된 대박)</option>
            <option value="relevance">관련성순</option>
            <option value="date">최신순 (트렌드)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">영상 길이</label>
          <select id="videoDuration" class="w-full rounded-lg border-gray-300 text-sm">
            <option value="medium">중간 (4~20분)</option>
            <option value="long" selected>롱폼 (20분 이상)</option>
            <option value="any">전체</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">업로드 기간 (이 날짜 이후)</label>
          <input id="publishedAfter" type="date" class="w-full rounded-lg border-gray-300 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 mb-1">검색 개수</label>
          <select id="maxResults" class="w-full rounded-lg border-gray-300 text-sm">
            <option value="10">10개 (빠름)</option>
            <option value="25" selected>25개 (추천)</option>
            <option value="50">50개 (쿼터 주의)</option>
          </select>
        </div>
      </div>
      
      <div class="mt-4 flex gap-2">
        <button id="btnSearch" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl hover:bg-indigo-700 font-bold shadow-md transition">🚀 분석 시작</button>
        <button id="btnExport" class="px-6 bg-gray-800 text-white py-2 rounded-xl hover:bg-gray-900 font-bold" disabled>CSV 저장</button>
      </div>
    </section>

    <section class="bg-indigo-50 rounded-2xl p-4 mb-6 border border-indigo-100">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-sm font-bold text-indigo-800">🔥 상위 노출 키워드 (제목/설명 분석)</h2>
        <button id="btnCopyKeywords" class="text-xs bg-white border px-2 py-1 rounded" disabled>복사</button>
      </div>
      <div id="keywordsBox" class="flex flex-wrap gap-2 text-xs">
        <span class="text-gray-400">검색 결과가 나오면 이곳에 주요 키워드가 표시됩니다.</span>
      </div>
    </section>

    <section class="bg-white rounded-2xl shadow overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead class="bg-gray-100 text-gray-600 uppercase text-xs">
            <tr>
              <th class="p-3">영상 정보 (제목/썸네일)</th>
              <th class="p-3 w-32">채널 지표</th>
              <th class="p-3 w-24 text-right">성과(V/S)</th>
              <th class="p-3 w-24 text-right">조회수</th>
              <th class="p-3 w-24">업로드</th>
            </tr>
          </thead>
          <tbody id="tbody" class="divide-y divide-gray-100"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    // --- 설정 및 유틸 ---
    const CACHE_KEY_PREFIX = 'yt_tool_v2_';
    
    // 한국어 조사 제거를 위한 간단한 처리 (완벽하진 않으나 효과적)
    function cleanKoreanWord(word) {
      // 끝에 붙는 조사들 제거 (길이가 2글자 이상일 때만)
      if (word.length < 2) return word;
      return word.replace(/(은|는|이|가|을|를|의|와|과|도|로|에|서)$/, '');
    }

    const els = {
      apiKey: document.getElementById('apiKey'),
      q: document.getElementById('q'),
      order: document.getElementById('order'),
      videoDuration: document.getElementById('videoDuration'),
      publishedAfter: document.getElementById('publishedAfter'),
      maxResults: document.getElementById('maxResults'),
      btnSearch: document.getElementById('btnSearch'),
      btnExport: document.getElementById('btnExport'),
      keywordsBox: document.getElementById('keywordsBox'),
      tbody: document.getElementById('tbody'),
      btnCopyKeywords: document.getElementById('btnCopyKeywords'),
      btnClearCache: document.getElementById('btnClearCache')
    };

    // 저장된 API Key 불러오기 (편의성)
    const savedKey = localStorage.getItem('yt_api_key');
    if(savedKey) els.apiKey.value = savedKey;

    let currentData = []; // CSV용 데이터 저장

    // 숫자 포맷
    const fmt = n => new Intl.NumberFormat('ko-KR', { notation: "compact", maximumFractionDigits: 1 }).format(n);
    const fmtFull = n => new Intl.NumberFormat('ko-KR').format(n);

    // --- 핵심 로직 ---

    async function fetchWithCache(url) {
      const cacheKey = CACHE_KEY_PREFIX + url;
      const cached = localStorage.getItem(cacheKey);
      
      if (cached) {
        const parsed = JSON.parse(cached);
        // 캐시 유효기간: 24시간 (API 아끼기 위해)
        if (Date.now() - parsed.timestamp < 1000 * 60 * 60 * 24) {
          console.log("Using Cache:", url);
          return parsed.data;
        }
      }

      const res = await fetch(url);
      if (!res.ok) throw new Error(`API Error: ${res.status}`);
      const data = await res.json();
      
      try {
        localStorage.setItem(cacheKey, JSON.stringify({
          timestamp: Date.now(),
          data: data
        }));
      } catch (e) { console.warn("Cache full"); }
      
      return data;
    }

    async function runSearch() {
      const key = els.apiKey.value.trim();
      const q = els.q.value.trim();
      if (!key || !q) return alert('API Key와 검색어를 입력하세요.');
      
      localStorage.setItem('yt_api_key', key); // 키 저장
      
      els.btnSearch.disabled = true;
      els.btnSearch.textContent = '데이터 분석 중...';
      els.tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center">유튜브 데이터를 가져오는 중입니다...</td></tr>';

      try {
        // 1. Search API (검색)
        const params = new URLSearchParams({
          part: 'snippet', type: 'video', q, key,
          maxResults: els.maxResults.value,
          order: els.order.value,
          videoDuration: els.videoDuration.value,
          regionCode: 'KR', relevanceLanguage: 'ko'
        });
        if (els.publishedAfter.value) params.append('publishedAfter', new Date(els.publishedAfter.value).toISOString());

        const searchData = await fetchWithCache(`https://www.googleapis.com/youtube/v3/search?${params}`);
        if (!searchData.items?.length) throw new Error('결과가 없습니다.');

        const videoIds = searchData.items.map(i => i.id.videoId);
        const channelIds = [...new Set(searchData.items.map(i => i.snippet.channelId))];

        // 2. Videos API (조회수, 길이 상세)
        const vParams = new URLSearchParams({ part: 'statistics,contentDetails,snippet', id: videoIds.join(','), key });
        const videoDetails = await fetchWithCache(`https://www.googleapis.com/youtube/v3/videos?${vParams}`);
        
        // 3. Channels API (구독자 수 확인 - V/S 계산용)
        // 주의: 채널 수가 많으면 URL 길이가 길어질 수 있으나 50개까진 보통 괜찮음
        const cParams = new URLSearchParams({ part: 'statistics', id: channelIds.join(','), key });
        const channelDetails = await fetchWithCache(`https://www.googleapis.com/youtube/v3/channels?${cParams}`);

        // 데이터 병합 (Map핑)
        const vMap = new Map(videoDetails.items.map(i => [i.id, i]));
        const cMap = new Map(channelDetails.items.map(i => [i.id, i.statistics]));

        const results = searchData.items.map(item => {
          const v = vMap.get(item.id.videoId);
          const cStats = cMap.get(item.snippet.channelId);
          
          if (!v) return null;

          const viewCount = parseInt(v.statistics.viewCount || 0);
          const subCount = parseInt(cStats?.subscriberCount || 1); // 0 방지
          const vsRatio = subCount > 0 ? (viewCount / subCount) : 0;
          
          return {
            id: item.id.videoId,
            title: item.snippet.title,
            desc: item.snippet.description,
            thumb: item.snippet.thumbnails.medium.url,
            channelTitle: item.snippet.channelTitle,
            publishedAt: item.snippet.publishedAt.split('T')[0],
            viewCount,
            subCount,
            vsRatio, // 구독자 대비 조회수 배율
            duration: v.contentDetails.duration
          };
        }).filter(Boolean);

        // V/S Ratio 내림차순 정렬 (이게 핵심!)
        // 사용자가 '조회수' 정렬을 원하면 그대로 두고, 아니면 분석을 위해 제공
        // 여기서는 기본 결과 순서에 V/S 정보를 붙여서 보여줌
        
        currentData = results;
        renderTable(results);
        analyzeKeywords(results);
        els.btnExport.disabled = false;

      } catch (err) {
        alert('오류 발생: ' + err.message);
        console.error(err);
      } finally {
        els.btnSearch.disabled = false;
        els.btnSearch.textContent = '🚀 분석 시작';
      }
    }

    function renderTable(data) {
      els.tbody.innerHTML = '';
      data.forEach(item => {
        // V/S Ratio가 1.0 넘으면(구독자보다 조회수가 많음) 강조
        const isViral = item.vsRatio > 1.5; 
        const rowClass = isViral ? 'bg-indigo-50' : '';
        const badge = isViral ? `<span class="bg-red-500 text-white text-[10px] px-1 rounded font-bold ml-1">떡상🔥</span>` : '';

        const tr = document.createElement('tr');
        tr.className = `border-b border-gray-100 hover:bg-gray-50 ${rowClass}`;
        tr.innerHTML = `
          <td class="p-3">
            <div class="flex gap-3">
              <img src="${item.thumb}" class="w-24 h-16 object-cover rounded shadow" />
              <div>
                <a href="https://youtu.be/${item.id}" target="_blank" class="text-indigo-700 font-bold hover:underline line-clamp-2 leading-tight">${item.title}</a>
                <p class="text-xs text-gray-500 mt-1 line-clamp-1">${item.desc}</p>
              </div>
            </div>
          </td>
          <td class="p-3">
            <div class="text-xs font-bold">${item.channelTitle}</div>
            <div class="text-xs text-gray-400">구독자: ${fmt(item.subCount)}</div>
          </td>
          <td class="p-3 text-right">
            <div class="font-bold text-indigo-600 ${isViral ? 'text-red-600' : ''}">${item.vsRatio.toFixed(1)}x</div>
            ${badge}
          </td>
          <td class="p-3 text-right text-xs font-mono text-gray-600">
            ${fmtFull(item.viewCount)}
          </td>
          <td class="p-3 text-xs text-gray-400">
            ${item.publishedAt}
          </td>
        `;
        els.tbody.appendChild(tr);
      });
    }

    function analyzeKeywords(data) {
      const text = data.map(i => i.title + ' ' + i.desc).join(' ');
      // 간단한 토크나이저
      const words = text.replace(/[^\w가-힣\s]/g, '').split(/\s+/);
      const counts = {};
      const stopWords = new Set(['영상','시니어','건강','유튜브','하는','합니다','있는','입니다','그리고','에서','으로','까지','정말','진짜','방법','이유','가지']);

      words.forEach(w => {
        if(w.length < 2) return;
        const clean = cleanKoreanWord(w); // 조사 제거
        if(stopWords.has(clean)) return;
        counts[clean] = (counts[clean] || 0) + 1;
      });

      const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 15);
      
      els.keywordsBox.innerHTML = sorted.map(([k, v]) => 
        `<span class="bg-white border border-indigo-200 text-indigo-800 px-2 py-1 rounded shadow-sm text-xs cursor-pointer hover:bg-indigo-100">${k} (${v})</span>`
      ).join('');
      
      els.btnCopyKeywords.disabled = false;
      els.btnCopyKeywords.onclick = () => {
        navigator.clipboard.writeText(sorted.map(i=>i[0]).join(', '));
        alert('키워드 복사 완료!');
      };
    }

    // CSV 다운로드
    els.btnExport.onclick = () => {
      const header = ['ID,제목,채널명,구독자,조회수,VS비율,게시일\n'];
      const rows = currentData.map(i => 
        `${i.id},"${i.title.replaceAll('"','""')}","${i.channelTitle}",${i.subCount},${i.viewCount},${i.vsRatio.toFixed(2)},${i.publishedAt}`
      );
      const blob = new Blob([header + rows.join('\n')], {type: 'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'youtube_analysis.csv';
      a.click();
    };

    // 캐시 초기화
    els.btnClearCache.onclick = () => {
      Object.keys(localStorage).forEach(k => {
        if(k.startsWith(CACHE_KEY_PREFIX)) localStorage.removeItem(k);
      });
      alert('캐시가 삭제되었습니다.');
      location.reload();
    };

    els.btnSearch.addEventListener('click', runSearch);
  </script>
</body>
</html>
