<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>시니어 롱폼 인사이트 툴 v4.0 (헤더 정렬)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html { scroll-behavior: smooth; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .wrap { word-break: break-word; }
    .high-potential { background-color: #f0fdf4; border-left: 4px solid #16a34a; }
    th.sortable:hover { background-color: #e5e7eb; cursor: pointer; user-select: none; }
  </style>
</head>
<body class="bg-gray-100 text-gray-900">
  <div class="max-w-7xl mx-auto p-4 sm:p-8">
    
    <header class="mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div>
        <h1 class="text-3xl font-extrabold text-indigo-900">시니어 롱폼 인사이트 v4.0</h1>
        <p class="text-base text-gray-600 mt-2">표제 헤더 클릭 정렬 기능 탑재</p>
      </div>
      
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 w-full sm:w-80">
        <div class="flex justify-between text-sm font-bold mb-1">
          <span class="text-gray-600">오늘 사용량 (예상)</span>
          <span id="quotaText" class="text-indigo-600">0 / 10,000</span>
        </div>
        <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
          <div id="quotaBar" class="bg-green-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
        <p class="text-xs text-gray-400 mt-1 text-right">*검색 1회당 약 160~200 차감</p>
      </div>
    </header>

    <section class="bg-white rounded-2xl shadow-md p-6 mb-8 border border-indigo-100">
      <div class="flex justify-end mb-4">
         <button id="btnClearCache" class="text-sm bg-white border border-red-200 text-red-600 px-3 py-1 rounded hover:bg-red-50 transition">🗑️ 캐시 및 쿼터 초기화</button>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        <div class="col-span-1 md:col-span-2">
          <label class="block text-sm font-bold text-gray-700 mb-2">YOUTUBE API KEY</label>
          <input id="apiKey" type="password" class="w-full rounded-xl border-gray-300 focus:ring-indigo-500 p-3 text-base shadow-sm" placeholder="API 키 입력" />
        </div>
        <div class="col-span-1 md:col-span-2">
          <label class="block text-sm font-bold text-gray-700 mb-2">검색어</label>
          <input id="q" type="text" class="w-full rounded-xl border-gray-300 focus:ring-indigo-500 p-3 text-base font-bold text-indigo-900 shadow-sm" placeholder="예: 60대 노후, 무릎 통증" />
        </div>
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">정렬 기준 (API)</label>
          <select id="order" class="w-full rounded-xl border-gray-300 p-3 text-base shadow-sm">
            <option value="viewCount">조회수순 (검증된 대박)</option>
            <option value="relevance">관련성순</option>
            <option value="date">최신순 (트렌드)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">영상 길이</label>
          <select id="videoDuration" class="w-full rounded-xl border-gray-300 p-3 text-base shadow-sm">
            <option value="medium">중간 (4~20분)</option>
            <option value="long" selected>롱폼 (20분 이상)</option>
            <option value="any">전체</option>
          </select>
        </div>
        
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">기간 설정</label>
          <select id="datePreset" class="w-full rounded-xl border-gray-300 p-3 text-base shadow-sm bg-indigo-50 text-indigo-900 font-bold">
            <option value="1year" selected>📅 최근 1년 (추천)</option>
            <option value="1month">🔥 최근 1개월 (트렌드)</option>
            <option value="all">🌐 전체 기간</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">검색 개수</label>
          <select id="maxResults" class="w-full rounded-xl border-gray-300 p-3 text-base shadow-sm">
            <option value="10">10개 (절약)</option>
            <option value="25" selected>25개 (추천)</option>
            <option value="50">50개 (쿼터 주의)</option>
          </select>
        </div>
      </div>
      
      <div class="mt-6 flex gap-3">
        <button id="btnSearch" class="flex-1 bg-indigo-700 text-white py-3 rounded-xl hover:bg-indigo-800 font-bold text-lg shadow-md transition transform active:scale-95">🚀 분석 시작</button>
        <button id="btnExport" class="px-8 bg-gray-800 text-white py-3 rounded-xl hover:bg-gray-900 font-bold text-lg shadow-md" disabled>CSV 저장</button>
      </div>
    </section>

    <section class="bg-indigo-50 rounded-2xl p-6 mb-8 border border-indigo-200 shadow-inner">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-indigo-900">🔥 상위 노출 키워드</h2>
        <button id="btnCopyKeywords" class="text-sm bg-white border border-gray-300 px-3 py-1.5 rounded hover:bg-gray-50 font-medium" disabled>키워드 복사</button>
      </div>
      <div id="keywordsBox" class="flex flex-wrap gap-3 text-sm min-h-[50px]">
        <span class="text-gray-500 text-base flex items-center">검색 결과가 나오면 이곳에 주요 키워드가 표시됩니다.</span>
      </div>
    </section>

    <section class="bg-white rounded-2xl shadow-lg overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead class="bg-gray-100 text-gray-700 uppercase text-sm border-b-2 border-gray-200">
            <tr>
              <th class="p-4 sortable" data-sort="title">영상 정보 (제목) <span id="sortIcon-title"></span></th>
              <th class="p-4 w-40 sortable" data-sort="subCount">채널 / 구독자 <span id="sortIcon-subCount"></span></th>
              <th class="p-4 w-32 text-center sortable" data-sort="vsRatio">성과(V/S) <span id="sortIcon-vsRatio"></span></th>
              <th class="p-4 w-32 text-right sortable" data-sort="viewCount">조회수 <span id="sortIcon-viewCount"></span></th>
              <th class="p-4 w-28 text-center sortable" data-sort="duration">시간 <span id="sortIcon-duration"></span></th>
              <th class="p-4 w-32 text-center sortable" data-sort="publishedAt">업로드 <span id="sortIcon-publishedAt"></span></th>
            </tr>
          </thead>
          <tbody id="tbody" class="divide-y divide-gray-100 text-base"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    // --- 설정 및 유틸 ---
    const CACHE_KEY_PREFIX = 'yt_tool_v3_';
    const QUOTA_KEY = 'yt_quota_usage';
    const DAILY_LIMIT = 10000;
    
    function cleanKoreanWord(word) {
      if (word.length < 2) return word;
      return word.replace(/(은|는|이|가|을|를|의|와|과|도|로|에|서)$/, '');
    }

    function parseDuration(iso) {
        if (!iso) return "";
        const match = iso.match(/PT(\d+H)?(\d+M)?(\d+S)?/);
        if (!match) return iso;
        const h = parseInt((match[1]||'').replace('H','')) || 0;
        const m = parseInt((match[2]||'').replace('M','')) || 0;
        const s = parseInt((match[3]||'').replace('S','')) || 0;
        const pad = n => n.toString().padStart(2,'0');
        return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
    }

    function getPublishedAfterDate(preset) {
        const now = new Date();
        if (preset === '1year') {
            now.setFullYear(now.getFullYear() - 1);
            return now.toISOString();
        } else if (preset === '1month') {
            now.setMonth(now.getMonth() - 1);
            return now.toISOString();
        }
        return null;
    }

    const els = {
      apiKey: document.getElementById('apiKey'),
      q: document.getElementById('q'),
      order: document.getElementById('order'),
      videoDuration: document.getElementById('videoDuration'),
      datePreset: document.getElementById('datePreset'),
      maxResults: document.getElementById('maxResults'),
      btnSearch: document.getElementById('btnSearch'),
      btnExport: document.getElementById('btnExport'),
      keywordsBox: document.getElementById('keywordsBox'),
      tbody: document.getElementById('tbody'),
      btnCopyKeywords: document.getElementById('btnCopyKeywords'),
      btnClearCache: document.getElementById('btnClearCache'),
      quotaText: document.getElementById('quotaText'),
      quotaBar: document.getElementById('quotaBar')
    };

    const savedKey = localStorage.getItem('yt_api_key');
    if(savedKey) els.apiKey.value = savedKey;

    let currentData = [];
    const fmt = n => new Intl.NumberFormat('ko-KR', { notation: "compact", maximumFractionDigits: 1 }).format(n);
    const fmtFull = n => new Intl.NumberFormat('ko-KR').format(n);

    // --- 쿼터 관리 ---
    function updateQuotaUI() {
        const today = new Date().toDateString();
        let qData = JSON.parse(localStorage.getItem(QUOTA_KEY) || '{}');
        if (qData.date !== today) {
            qData = { date: today, used: 0 };
            localStorage.setItem(QUOTA_KEY, JSON.stringify(qData));
        }
        const used = qData.used;
        const pct = Math.min((used / DAILY_LIMIT) * 100, 100);
        els.quotaText.textContent = `${used.toLocaleString()} / 10,000`;
        els.quotaBar.style.width = `${pct}%`;
        
        if(pct > 80) els.quotaBar.className = "h-3 rounded-full transition-all duration-500 bg-red-500";
        else if(pct > 50) els.quotaBar.className = "h-3 rounded-full transition-all duration-500 bg-yellow-400";
        else els.quotaBar.className = "h-3 rounded-full transition-all duration-500 bg-green-500";
    }

    function addQuotaUsage(cost) {
        const today = new Date().toDateString();
        let qData = JSON.parse(localStorage.getItem(QUOTA_KEY) || '{}');
        if (qData.date !== today) qData = { date: today, used: 0 };
        qData.used += cost;
        localStorage.setItem(QUOTA_KEY, JSON.stringify(qData));
        updateQuotaUI();
    }
    updateQuotaUI();

    // --- API 호출 ---
    async function fetchWithCache(url, cost) {
      const cacheKey = CACHE_KEY_PREFIX + url;
      const cached = localStorage.getItem(cacheKey);
      if (cached) {
        const parsed = JSON.parse(cached);
        if (Date.now() - parsed.timestamp < 1000 * 60 * 60 * 24) {
          console.log("Using Cache (No Cost):", url);
          return parsed.data;
        }
      }
      const res = await fetch(url);
      if (!res.ok) throw new Error(`API Error: ${res.status}`);
      const data = await res.json();
      try {
        localStorage.setItem(cacheKey, JSON.stringify({ timestamp: Date.now(), data: data }));
        addQuotaUsage(cost);
      } catch (e) { console.warn("Cache full"); }
      return data;
    }

    async function runSearch() {
      const key = els.apiKey.value.trim();
      const q = els.q.value.trim();
      if (!key || !q) return alert('API Key와 검색어를 입력하세요.');
      localStorage.setItem('yt_api_key', key);
      
      els.btnSearch.disabled = true;
      els.btnSearch.textContent = '데이터 분석 중...';
      els.tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-lg text-gray-500">데이터를 가져오는 중입니다...</td></tr>';

      try {
        const maxResults = parseInt(els.maxResults.value);
        const publishedAfter = getPublishedAfterDate(els.datePreset.value);

        const params = new URLSearchParams({
          part: 'snippet', type: 'video', q, key,
          maxResults: maxResults,
          order: els.order.value,
          videoDuration: els.videoDuration.value,
          regionCode: 'KR', relevanceLanguage: 'ko'
        });
        if (publishedAfter) params.append('publishedAfter', publishedAfter);

        const searchData = await fetchWithCache(`https://www.googleapis.com/youtube/v3/search?${params}`, 100);
        if (!searchData.items?.length) throw new Error('결과가 없습니다.');

        const videoIds = searchData.items.map(i => i.id.videoId);
        const channelIds = [...new Set(searchData.items.map(i => i.snippet.channelId))];

        const vParams = new URLSearchParams({ part: 'statistics,contentDetails,snippet', id: videoIds.join(','), key });
        const videoDetails = await fetchWithCache(`https://www.googleapis.com/youtube/v3/videos?${vParams}`, videoIds.length);
        
        const cParams = new URLSearchParams({ part: 'statistics', id: channelIds.join(','), key });
        const channelDetails = await fetchWithCache(`https://www.googleapis.com/youtube/v3/channels?${cParams}`, channelIds.length);

        const vMap = new Map(videoDetails.items.map(i => [i.id, i]));
        const cMap = new Map(channelDetails.items.map(i => [i.id, i.statistics]));

        const results = searchData.items.map(item => {
          const v = vMap.get(item.id.videoId);
          const cStats = cMap.get(item.snippet.channelId);
          if (!v) return null;

          const viewCount = parseInt(v.statistics.viewCount || 0);
          const subCount = parseInt(cStats?.subscriberCount || 1);
          const vsRatio = subCount > 0 ? (viewCount / subCount) : 0;
          
          return {
            id: item.id.videoId,
            title: item.snippet.title,
            desc: item.snippet.description,
            thumb: item.snippet.thumbnails.medium.url,
            channelTitle: item.snippet.channelTitle,
            publishedAt: item.snippet.publishedAt.split('T')[0],
            viewCount,
            subCount,
            vsRatio,
            duration: v.contentDetails.duration,
            durationSec: parseISO8601DurationToSeconds(v.contentDetails.duration) // 정렬용 초 단위 시간
          };
        }).filter(Boolean);
        
        currentData = results;
        // 초기 정렬 상태 (기본: API 검색 결과 순)
        currentSort = { key: null, order: 'asc' };
        updateSortIcons();
        renderTable(results);
        analyzeKeywords(results);
        els.btnExport.disabled = false;

      } catch (err) {
        alert('오류 발생: ' + err.message);
        console.error(err);
      } finally {
        els.btnSearch.disabled = false;
        els.btnSearch.textContent = '🚀 분석 시작';
      }
    }

    // --- 정렬 로직 추가 ---
    let currentSort = { key: null, order: 'asc' }; // 현재 정렬 상태

    document.querySelectorAll('th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.dataset.sort;
        if (currentSort.key === key) {
          currentSort.order = currentSort.order === 'asc' ? 'desc' : 'asc';
        } else {
          currentSort.key = key;
          currentSort.order = 'desc'; // 기본 내림차순 (높은게 위로)
          if (key === 'title' || key === 'publishedAt') currentSort.order = 'asc'; // 텍스트, 날짜는 오름차순 기본
        }
        sortData(key, currentSort.order);
        updateSortIcons();
      });
    });

    function sortData(key, order) {
      if (!currentData.length) return;
      
      currentData.sort((a, b) => {
        let valA = a[key];
        let valB = b[key];
        
        // 문자열 비교
        if (typeof valA === 'string') {
          valA = valA.toLowerCase();
          valB = valB.toLowerCase();
          if (valA < valB) return order === 'asc' ? -1 : 1;
          if (valA > valB) return order === 'asc' ? 1 : -1;
          return 0;
        }
        
        // 숫자 비교
        return order === 'asc' ? valA - valB : valB - valA;
      });
      renderTable(currentData);
    }

    function updateSortIcons() {
      document.querySelectorAll('th.sortable span').forEach(span => span.textContent = '');
      if (currentSort.key) {
        const icon = currentSort.order === 'asc' ? ' ▲' : ' ▼';
        document.getElementById(`sortIcon-${currentSort.key}`).textContent = icon;
      }
    }
    
    // ISO 8601 duration을 초 단위로 변환 (정렬용)
    function parseISO8601DurationToSeconds(iso) {
        if (!iso) return 0;
        const match = iso.match(/PT(\d+H)?(\d+M)?(\d+S)?/);
        if (!match) return 0;
        const h = parseInt((match[1]||'').replace('H','')) || 0;
        const m = parseInt((match[2]||'').replace('M','')) || 0;
        const s = parseInt((match[3]||'').replace('S','')) || 0;
        return h * 3600 + m * 60 + s;
    }


    function renderTable(data) {
      els.tbody.innerHTML = '';
      data.forEach(item => {
        const isViral = item.vsRatio > 1.5; 
        const rowClass = isViral ? 'high-potential' : '';
        const badge = isViral ? `<br><span class="bg-red-600 text-white text-xs px-2 py-0.5 rounded-full font-bold shadow-sm">떡상🔥</span>` : '';

        const tr = document.createElement('tr');
        tr.className = `border-b border-gray-100 hover:bg-gray-50 transition-colors ${rowClass}`;
        tr.innerHTML = `
          <td class="p-4">
            <div class="flex gap-4">
              <img src="${item.thumb}" class="w-32 h-20 object-cover rounded-lg shadow-md" />
              <div class="flex-1">
                <a href="https://youtu.be/${item.id}" target="_blank" class="text-indigo-800 font-bold text-lg hover:underline line-clamp-2 leading-snug">${item.title}</a>
                <p class="text-sm text-gray-500 mt-1 line-clamp-1">${item.desc}</p>
              </div>
            </div>
          </td>
          <td class="p-4">
            <div class="font-bold text-gray-800">${item.channelTitle}</div>
            <div class="text-sm text-gray-500">구독자: ${fmt(item.subCount)}</div>
          </td>
          <td class="p-4 text-center">
            <div class="font-extrabold text-xl text-indigo-700 ${isViral ? 'text-red-600' : ''}">${item.vsRatio.toFixed(1)}x</div>
            ${badge}
          </td>
          <td class="p-4 text-right">
            <div class="font-mono text-lg font-bold text-gray-700">${fmtFull(item.viewCount)}</div>
          </td>
          <td class="p-4 text-center">
            <div class="font-mono text-base bg-gray-100 px-2 py-1 rounded text-gray-700 inline-block font-bold">${parseDuration(item.duration)}</div>
          </td>
          <td class="p-4 text-center text-sm text-gray-500">
            ${item.publishedAt}
          </td>
        `;
        els.tbody.appendChild(tr);
      });
    }

    function analyzeKeywords(data) {
      const text = data.map(i => i.title + ' ' + i.desc).join(' ');
      const words = text.replace(/[^\w가-힣\s]/g, '').split(/\s+/);
      const counts = {};
      const stopWords = new Set(['영상','시니어','건강','유튜브','하는','합니다','있는','입니다','그리고','에서','으로','까지','정말','진짜','방법','이유','가지','티비','TV']);

      words.forEach(w => {
        if(w.length < 2) return;
        const clean = cleanKoreanWord(w);
        if(stopWords.has(clean)) return;
        counts[clean] = (counts[clean] || 0) + 1;
      });

      const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 20);
      els.keywordsBox.innerHTML = sorted.map(([k, v]) => 
        `<span class="bg-indigo-50 border border-indigo-200 text-indigo-900 px-3 py-1.5 rounded-lg shadow-sm text-base font-medium cursor-pointer hover:bg-indigo-100 transition">${k} <span class="text-indigo-400 text-xs ml-1">${v}</span></span>`
      ).join('');
      els.btnCopyKeywords.disabled = false;
      els.btnCopyKeywords.onclick = () => {
        navigator.clipboard.writeText(sorted.map(i=>i[0]).join(', '));
        alert('키워드 복사 완료!');
      };
    }

    els.btnExport.onclick = () => {
      const header = ['ID,제목,채널명,구독자,조회수,VS비율,길이,게시일\n'];
      const rows = currentData.map(i => `${i.id},"${i.title.replaceAll('"','""')}","${i.channelTitle}",${i.subCount},${i.viewCount},${i.vsRatio.toFixed(2)},${parseDuration(i.duration)},${i.publishedAt}`);
      const blob = new Blob([header + rows.join('\n')], {type: 'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'youtube_analysis_v4.0.csv';
      a.click();
    };

    els.btnClearCache.onclick = () => {
      if(confirm('캐시 데이터와 오늘의 쿼터 사용량을 모두 초기화하시겠습니까?')) {
        Object.keys(localStorage).forEach(k => {
          if(k.startsWith(CACHE_KEY_PREFIX) || k === QUOTA_KEY) localStorage.removeItem(k);
        });
        alert('초기화 완료.');
        location.reload();
      }
    };

    els.btnSearch.addEventListener('click', runSearch);
  </script>
</body>
</html>
